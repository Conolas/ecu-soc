<h1>ECU SoC — Block Diagram</h1>

<!-- ═══════════════════════════════════════════════════════ -->

 · 50 MHz · little-endian

wdata[31:0] · rdata[31:0] · we · re">

  <text x="490" y="74" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">config · mode · monitor</text>
  <text x="490" y="88" text-anchor="middle" font-size="10" fill="#3d444d" font-family="Courier New">clk · reset · addr[31:0] · we · re</text>
</g>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- ② System Bus -->
<g class="blk" id="bus" data-title="System Bus" data-body="32-bit memory-mapped · single master
Single-cycle access · no wait states
Decode addr → select peripheral
Mux rdata from selected peripheral" data-sig="addr[31:0] · wdata[31:0]
rdata[31:0] · we · re">

  <rect x="100" y="146" width="780" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"></rect>
  <text x="490" y="163" text-anchor="middle" font-size="12" fill="#58a6ff" font-family="Courier New" font-weight="700">SYSTEM BUS — 32-bit Memory-Mapped</text>
  <text x="490" y="179" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">addr[31:0] · wdata[31:0] · rdata[31:0] · we · re</text>
</g>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- ③ Memory ROM/RAM -->
<g class="blk" id="mem" data-title="Memory — ROM + RAM" data-body="ROM: firmware image (preloaded)
RAM: variables, setpoint cache, logs
ROM: 32–64 KB · RAM: 16–32 KB
Width: 32-bit" data-sig="addr · wdata · rdata · we">
  <rect x="100" y="228" width="136" height="62" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1.2"></rect>
  <text x="168" y="250" text-anchor="middle" font-size="12" fill="#bc8cff" font-family="Courier New" font-weight="700">Memory</text>

  <text x="168" y="279" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">addr · rdata · wdata · we</text>
</g>

<!-- ④ Timer -->
<g class="blk" id="timer" data-title="Timer Unit" data-body="Role: deterministic control tick
Prescaler + counter + compare
Tick rate: 200–500 Hz (PID sample)
Registers: COUNT · COMPARE · CTRL" data-sig="clk → tick_irq (200–500 Hz)
COUNT · COMPARE · CTRL[prescale,en]">
  <rect x="418" y="228" width="144" height="62" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.2"></rect>
  <text x="490" y="250" text-anchor="middle" font-size="12" fill="#d29922" font-family="Courier New" font-weight="700">Timer Unit</text>
  <text x="490" y="265" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">prescaler · counter · cmp</text>
  <text x="490" y="279" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">200–500 Hz tick_irq</text>
</g>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- CONTROL CHAIN HEADER -->
<text x="490" y="325" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New" letter-spacing="2">── DETERMINISTIC CONTROL PATH ──</text>

<!-- ⑥ I2C Master -->
<g class="blk" id="i2c" data-title="I²C Master" data-body="Reads IMU sensor registers
FSM: START→ADDR→R/W→STOP
Speed: 100 kHz · 7-bit addressing
Registers: CMD · ADDR · DATA · STATUS" data-sig="SCL · SDA (open-drain)
CMD · ADDR[7b] · DATA · STATUS">

  <text x="126" y="362" text-anchor="middle" font-size="12" fill="#58a6ff" font-family="Courier New" font-weight="700">I²C Master</text>
  <text x="126" y="377" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">IMU · 100 kHz · FSM</text>
  <text x="126" y="391" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">SCL · SDA · CMD · STATUS</text>
</g>

<text x="222" y="367" text-anchor="middle" font-size="9" fill="#58a6ff" font-family="Courier New">raw[7:0]</text>

<!-- ⑦ Meas/Filter -->
<g class="blk" id="filt" data-title="Measurement Register / Filter" data-body="Stable, time-aligned measurement
Decouples I²C timing from control loop
Optional: moving-average or LPF
Output: measurement in Q16.16" data-sig="in: raw I²C data
out: measurement (Q16.16)">

  <text x="326" y="358" text-anchor="middle" font-size="11" fill="#58a6ff" font-family="Courier New" font-weight="700">Meas/Filter</text>
  <text x="326" y="373" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">reg + LPF · Q16.16</text>
  <text x="326" y="387" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">meas[31:0] Q16.16 out</text>
</g>

<!-- Meas → Error Calc -->
<line x1="406" y1="371" x2="454" y2="371" stroke="#7ee787" stroke-width="1.2" marker-end="url(#arrg)"></line>
<text x="430" y="367" text-anchor="middle" font-size="9" fill="#7ee787" font-family="Courier New">meas</text>

<!-- ⑧ Error Calc -->
<g class="blk" id="err" data-title="Error Calculation" data-body="32-bit subtractor
error = setpoint − measurement
Both inputs in Q16.16 format
Output error fed directly to PID HW" data-sig="setpoint (Q16.16) from PID reg
meas (Q16.16) → error (Q16.16)">
  <rect x="454" y="340" width="156" height="62" rx="6" fill="#0d1117" stroke="#7ee787" stroke-width="1.2"></rect>
  <text x="532" y="358" text-anchor="middle" font-size="11" fill="#7ee787" font-family="Courier New" font-weight="700">Error Calc</text>
  <text x="532" y="373" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">error = setpoint − meas</text>
  <text x="532" y="387" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">error[31:0] Q16.16</text>
</g>

<!-- Error → PID -->
<line x1="610" y1="371" x2="658" y2="371" stroke="#7ee787" stroke-width="1.5" marker-end="url(#arrg)"></line>
<text x="634" y="367" text-anchor="middle" font-size="9" fill="#7ee787" font-family="Courier New">error</text>

<!-- ⑨ HW PID Accelerator -->
<g class="blk" id="pid" data-title="HW PID Accelerator" data-body="P = Kp × error
I = clamp(I + Ki × error)
D = Kd × (error − prev_error)
u = clamp(P+I+D) · anti-windup
Format: Q16.16 · triggered by tick_irq" data-sig="SETPOINT · KP · KI · KD · CTRL
STATUS · U_OUT · @ 0x1000_5000">
  <rect x="658" y="330" width="172" height="82" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.5"></rect>
  <text x="744" y="353" text-anchor="middle" font-size="12" fill="#f85149" font-family="Courier New" font-weight="700">HW PID Accel</text>
  <text x="744" y="369" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">P · I · D · clamp · anti-windup</text>
  <text x="744" y="384" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">Q16.16 · 3× mult · adder</text>
  <text x="744" y="399" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">0x1000_5000 · KP/KI/KD/SETPT</text>
</g>

<!-- Timer tick_irq to PID -->
<path d="M490 290 L490 310 L744 310 L744 330" fill="none" stroke="#d29922" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arro)"></path>
<text x="620" y="307" text-anchor="middle" font-size="9" fill="#d29922" font-family="Courier New">tick_irq (200–500 Hz)</text>

<text x="870" y="112" text-anchor="middle" font-size="9" fill="#58a6ff" font-family="Courier New">CPU config writes: SETPOINT · KP · KI · KD · CTRL</text>

<text x="766" y="440" font-size="9" fill="#f85149" font-family="Courier New">control_out[31:0]</text>

<!-- ⑩ PWM Generator -->
<g class="blk" id="pwm" data-title="PWM Generator" data-body="Converts control_out to duty cycle
10-bit counter + comparator
Frequency: 10–20 kHz · 10-bit res
Registers: DUTY_L · DUTY_R
Address: 0x1000_4000" data-sig="duty_L[9:0] · duty_R[9:0]
PWM_L · PWM_R (10–20 kHz)">
  <rect x="528" y="460" width="172" height="62" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5"></rect>
  <text x="614" y="482" text-anchor="middle" font-size="12" fill="#d29922" font-family="Courier New" font-weight="700">PWM Generator</text>
  <text x="614" y="497" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">10-bit · 10–20 kHz counter/cmp</text>
  <text x="614" y="511" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">DUTY_L · DUTY_R · 0x1000_4000</text>
</g>

<!-- PID → PWM (route left from PID bottom) -->
<path d="M744 460 L744 491 L700 491" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrr)"></path>

<!-- PWM down to Motor IF -->
<line x1="614" y1="522" x2="614" y2="560" stroke="#d29922" stroke-width="1.5" marker-end="url(#arro)"></line>
<text x="636" y="545" font-size="9" fill="#d29922" font-family="Courier New">PWM_L · PWM_R</text>

<!-- ⑪ Motor Interface -->
<g class="blk" id="motif" data-title="Motor Interface" data-body="Maps duty + sign to driver pins
DIR = sign(control)
PWM = abs(control)
EN = system_enable
Outputs: PWM_L/R · DIR_L/R · EN" data-sig="in: signed control / PWM
out: PWM_L/R · DIR_L/R · EN">
  <rect x="424" y="560" width="172" height="62" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5"></rect>
  <text x="510" y="582" text-anchor="middle" font-size="12" fill="#d29922" font-family="Courier New" font-weight="700">Motor Interface</text>
  <text x="510" y="597" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">sign→DIR · abs→PWM · EN</text>
  <text x="510" y="611" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">DIR_L · DIR_R · EN_L · EN_R</text>
</g>

<!-- PWM → Motor IF (route left) -->
<path d="M614 560 L614 591 L596 591" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#arro)"></path>

<!-- Motor IF down to Driver -->
<line x1="510" y1="622" x2="510" y2="776" stroke="#d29922" stroke-width="1.5" marker-end="url(#arro)"></line>
<text x="530" y="700" font-size="9" fill="#d29922" font-family="Courier New">RPWM · LPWM · R_EN · L_EN</text>

<!-- External layer -->

<!-- IMU (external) -->
<g class="blk" id="imu" data-title="IMU Sensor (external)" data-body="Mounted on robot chassis
Measures angular velocity (gyro)
and linear acceleration (accel)
Returns data over I²C bus" data-sig="SCL · SDA → I²C master
gyro[15:0] · accel[15:0]">

  <text x="106" y="815" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">gyro · accel · I²C</text>
  <text x="106" y="829" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">external · on chassis</text>
</g>

<!-- H-Bridge Driver -->
<g class="blk" id="drv" data-title="H-Bridge Driver (BTS7960B)" data-body="External high-current IC
Converts PWM+DIR+EN to motor current
Drives left and right motors independently
In sim: replaced by motor model" data-sig="RPWM · LPWM · R_EN · L_EN
→ Motor+ · Motor− (high current)">
  <rect x="416" y="776" width="180" height="62" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"></rect>
  <text x="506" y="800" text-anchor="middle" font-size="11" fill="#8b949e" font-family="Courier New" font-weight="700">H-Bridge Driver</text>
  <text x="506" y="815" text-anchor="middle" font-size="10" fill="#6e7681" font-family="Courier New">BTS7960B · high current</text>
  <text x="506" y="829" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">external IC · left + right</text>
</g>

Motion causes IMU readings to change
That change closes the PID loop" data-sig="Motor+/Motor− from H-bridge

  <text x="720" y="829" text-anchor="middle" font-size="9" fill="#3d444d" font-family="Courier New">physical motion → IMU</text>
</g>

<!-- Driver → Motors -->

<text x="618" y="802" text-anchor="middle" font-size="9" fill="#6e7681" font-family="Courier New">Motor+/−</text>

<!-- LEGEND -->

<div id="tip" style="display: none; left: 1305px; top: 291px;"><strong>System Bus</strong>32-bit memory-mapped · single master<br>Single-cycle access · no wait states<br>Decode addr → select peripheral<br>Mux rdata from selected peripheral<br><div class="sig">addr[31:0] · wdata[31:0]<br>rdata[31:0] · we · re</div></div>
<script>
const tip = document.getElementById('tip');
document.querySelectorAll('.blk').forEach(el => {
  el.addEventListener('mouseenter', e => {
    const t = el.dataset.title;
    const b = (el.dataset.body||'').replace(/\n/g,'<br>');
    const s = el.dataset.sig ? `<div class="sig">${el.dataset.sig.replace(/\n/g,'<br>')}</div>` : '';
    tip.innerHTML = `<strong>${t}</strong>${b}${s ? '<br>'+s : ''}`;
    tip.style.display = 'block';
  });
  el.addEventListener('mousemove', e => {
    tip.style.left = (e.clientX+14)+'px';
    tip.style.top  = (e.clientY+14)+'px';
  });
  el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
});
</script>
