<svg xmlns="http://www.w3.org/2000/svg" width="2720" height="961" viewBox="0 0 2720 961" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a_lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#B6E35A"/></marker><marker id="s_lime" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1.2 L1 5 L9 8.8 Z" fill="#B6E35A"/></marker><marker id="a_mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#899198"/></marker><marker id="s_mut" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1.2 L1 5 L9 8.8 Z" fill="#899198"/></marker><marker id="a_txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#F2F0E8"/></marker><marker id="s_txt" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1.2 L1 5 L9 8.8 Z" fill="#F2F0E8"/></marker></defs><rect width="2720" height="961" fill="#121417"/><text x="40.0" y="52.0" font-family="JetBrains Mono" font-weight="600" font-size="34" fill="#F2F0E8" text-anchor="start">clk_rst_gen  ·  RTL BLOCK</text><text x="40.0" y="90.0" font-family="JetBrains Mono" font-weight="400" font-size="19" fill="#899198" text-anchor="start">owner Vedam  ·  Verilog-2001  ·  no parameters</text><text x="40.0" y="122.0" font-family="JetBrains Mono" font-weight="400" font-size="21" fill="#B6E35A" text-anchor="start">Turns the board clock and reset into the one clean clk and rst_n that every block uses.</text><rect x="650" y="160" width="1420" height="461" rx="6" fill="#101316" stroke="#2B3036" stroke-width="1.5"/><text x="668.0" y="190.0" font-family="JetBrains Mono" font-weight="500" font-size="20" fill="#B6E35A" text-anchor="start" letter-spacing="3">INSIDE CLK_RST_GEN</text><rect x="690" y="425" width="290" height="146" rx="5" fill="#1C1F22" stroke="#4A5158" stroke-width="1.8"/><text x="835.0" y="482.9" font-family="JetBrains Mono" font-weight="600" font-size="21" fill="#F2F0E8" text-anchor="middle">reset_assert (ASYNC)</text><text x="835.0" y="509.1" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">rst_n_in low OR pll_locked</text><text x="835.0" y="528.6" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">low ⇒ rst_n low at once</text><rect x="1040" y="425" width="290" height="146" rx="5" fill="#1C1F22" stroke="#4A5158" stroke-width="1.8"/><text x="1185.0" y="492.7" font-family="JetBrains Mono" font-weight="600" font-size="21" fill="#F2F0E8" text-anchor="middle">release synchroniser</text><text x="1185.0" y="518.9" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">2 flops on the release edge</text><rect x="1390" y="425" width="290" height="146" rx="5" fill="#1C1F22" stroke="#4A5158" stroke-width="1.8"/><text x="1535.0" y="482.9" font-family="JetBrains Mono" font-weight="600" font-size="21" fill="#F2F0E8" text-anchor="middle">power-on hold counter</text><text x="1535.0" y="509.1" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">255 clk cycles after both</text><text x="1535.0" y="528.6" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">conditions are OK</text><rect x="1740" y="425" width="290" height="146" rx="5" fill="#1C1F22" stroke="#B6E35A" stroke-width="2.6"/><text x="1885.0" y="482.9" font-family="JetBrains Mono" font-weight="600" font-size="21" fill="#F2F0E8" text-anchor="middle">rst_n output</text><text x="1885.0" y="509.1" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">low at once; high 257 cycles</text><text x="1885.0" y="528.6" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">after the last low</text><rect x="1740" y="210" width="290" height="146" rx="5" fill="#1C1F22" stroke="#4A5158" stroke-width="1.8"/><text x="1885.0" y="267.9" font-family="JetBrains Mono" font-weight="600" font-size="21" fill="#F2F0E8" text-anchor="middle">clk pass-through</text><text x="1885.0" y="294.1" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">clk = clk_in (buffering is</text><text x="1885.0" y="313.6" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#899198" text-anchor="middle">done by the tool)</text><path d="M980.0 498.0 L1040.0 498.0" fill="none" stroke="#B6E35A" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#a_lime)"/><rect x="969.4" y="472.7" width="81.2" height="18.2" fill="#101316"/><text x="1010.0" y="486.0" font-family="JetBrains Mono" font-weight="400" font-size="14" fill="#899198" text-anchor="middle">released</text><path d="M1330.0 498.0 L1390.0 498.0" fill="none" stroke="#B6E35A" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#a_lime)"/><rect x="1323.6" y="472.7" width="72.8" height="18.2" fill="#101316"/><text x="1360.0" y="486.0" font-family="JetBrains Mono" font-weight="400" font-size="14" fill="#899198" text-anchor="middle">sync ok</text><path d="M1680.0 498.0 L1740.0 498.0" fill="none" stroke="#B6E35A" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#a_lime)"/><rect x="1665.2" y="472.7" width="89.7" height="18.2" fill="#101316"/><text x="1710.0" y="486.0" font-family="JetBrains Mono" font-weight="400" font-size="14" fill="#899198" text-anchor="middle">hold done</text><path d="M836.0 571.0 L836.0 612.0 L1884.0 612.0 L1884.0 571.0" fill="none" stroke="#899198" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a_mut)"/><rect x="1294.2" y="589.7" width="131.7" height="18.2" fill="#101316"/><text x="1360.0" y="603.0" font-family="JetBrains Mono" font-weight="400" font-size="14" fill="#899198" text-anchor="middle">assert (async)</text><rect x="40" y="160" width="560" height="92" rx="6" fill="#1C1F22" stroke="#4A5158" stroke-width="2"/><text x="56.0" y="188.0" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#B6E35A" text-anchor="start" letter-spacing="2">CLOCK IN</text><text x="56.0" y="214.0" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#F2F0E8" text-anchor="start">clk_in</text><text x="56.0" y="236.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">← pin clk_in</text><path d="M600.0 206.0 L618.0 206.0 L618.0 186.0 L1780.0 186.0 L1780.0 210.0" fill="none" stroke="#B6E35A" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#a_lime)"/><rect x="40" y="266" width="560" height="92" rx="6" fill="#1C1F22" stroke="#4A5158" stroke-width="2"/><text x="56.0" y="294.0" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#B6E35A" text-anchor="start" letter-spacing="2">RESET IN</text><text x="56.0" y="320.0" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#F2F0E8" text-anchor="start">rst_n_in · pll_locked_i</text><text x="56.0" y="342.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">← pin rst_n_in, pin pll_locked_i</text><path d="M600.0 312.0 L626.0 312.0 L626.0 449.0 L690.0 449.0" fill="none" stroke="#B6E35A" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#a_lime)"/><rect x="2120" y="160" width="560" height="158" rx="6" fill="#1C1F22" stroke="#4A5158" stroke-width="2"/><text x="2136.0" y="188.0" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#B6E35A" text-anchor="start" letter-spacing="2">CLOCK OUT</text><text x="2136.0" y="214.0" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#F2F0E8" text-anchor="start">clk</text><text x="2136.0" y="236.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">→ timer_unit, i2c_sensor_subsystem, sensor_pipeline,</text><text x="2136.0" y="258.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">hw_pid_accel, actuation_subsystem,</text><text x="2136.0" y="280.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">safety_fault_monitor, rom_dp, ram_sp,</text><text x="2136.0" y="302.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">bus_interconnect, cpu_subsystem</text><path d="M2030.0 234.0 L2102.0 234.0 L2102.0 239.0 L2120.0 239.0" fill="none" stroke="#B6E35A" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#a_lime)"/><rect x="2120" y="332" width="560" height="136" rx="6" fill="#1C1F22" stroke="#B6E35A" stroke-width="2"/><text x="2136.0" y="360.0" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#B6E35A" text-anchor="start" letter-spacing="2">RESET OUT</text><text x="2136.0" y="386.0" font-family="JetBrains Mono" font-weight="500" font-size="17" fill="#F2F0E8" text-anchor="start">rst_n</text><text x="2136.0" y="408.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">→ timer_unit, i2c_sensor_subsystem, sensor_pipeline,</text><text x="2136.0" y="430.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">hw_pid_accel, actuation_subsystem,</text><text x="2136.0" y="452.0" font-family="JetBrains Mono" font-weight="400" font-size="16" fill="#899198" text-anchor="start">safety_fault_monitor, bus_interconnect, cpu_subsystem</text><path d="M2030.0 449.0 L2094.0 449.0 L2094.0 400.0 L2120.0 400.0" fill="none" stroke="#B6E35A" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#a_lime)"/><text x="650.0" y="771.0" font-family="JetBrains Mono" font-weight="400" font-size="17" fill="#899198" text-anchor="start">Only block allowed to use an asynchronous reset. Bounce test: rst_n stays low for the whole bounce and releases 255+2 cycles after the last high.</text></svg>